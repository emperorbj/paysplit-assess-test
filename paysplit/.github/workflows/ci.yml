# Runs on every PR (and on pushes to develop/main). Make the "checks" job a
# required status check in branch protection so broken code can't be merged.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: "0" # no git hooks in CI
      # Build-time only; any valid URL works for compiling.
      NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid/api/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Yarn 4
        run: corepack enable && corepack prepare yarn@4.18.1 --activate

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - run: yarn install --immutable

      - name: Format
        run: yarn format:check

      - name: Lint
        run: yarn lint --max-warnings=0

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test

      - name: Build
        run: yarn build
